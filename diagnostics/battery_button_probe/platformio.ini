; Temporary diagnostic project for the Guition JC2432W328 board.
; Reads candidate battery-sense ADC pins and candidate SW1 button GPIOs so we
; can discover what the hardware actually exposes. Not part of the product.

[platformio]
default_envs = probe

[env:probe]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
